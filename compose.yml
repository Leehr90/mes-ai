services:
  db:
    image: postgres:16
    container_name: mes-postgres
    environment:
      POSTGRES_DB: mes_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - mes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mes_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mes-server
    environment:
      MES_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mes_ai
      MES_AUTH_MODE: none
      MES_LOG_LEVEL: WARNING
      MES_EVENT_BUS_TYPE: memory
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy

  dt-client:
    build:
      context: .
      dockerfile: clients/design_time/Dockerfile
    container_name: mes-dt-client
    environment:
      MES_SERVER_URL: http://server:8082
    ports:
      - "5173:5173"
    depends_on:
      - server

  rt-client:
    build:
      context: .
      dockerfile: clients/run_time/Dockerfile
    container_name: mes-rt-client
    environment:
      MES_SERVER_URL: http://server:8082
    ports:
      - "5176:5176"
    depends_on:
      - server
      
volumes:
  mes_pg_data: